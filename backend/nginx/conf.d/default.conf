server {
    listen 80;
    server_name unicon.min1870.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name unicon.min1870.com;

    ssl_certificate     /etc/letsencrypt/live/unicon.min1870.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unicon.min1870.com/privkey.pem;

    root   /statics;
    index  index.html;
        
    location / {
        root /statics;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://drf:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
